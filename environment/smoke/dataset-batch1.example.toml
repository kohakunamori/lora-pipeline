[general]
caption_extension = ".txt"
shuffle_caption = true
keep_tokens = 1
caption_tag_dropout_rate = 0.05

[[datasets]]
resolution = [1024, 1024]
batch_size = 1
enable_bucket = true
bucket_no_upscale = true
bucket_reso_steps = 32

  [[datasets.subsets]]
  image_dir = "/path/to/smoke-dataset"
  num_repeats = 1
