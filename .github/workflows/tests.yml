name: tests

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install pytest==9.0.2 PyYAML==6.0.3 Pillow==12.1.0 ImageHash==4.3.2 Jinja2==3.1.6 rich==14.1.0 safetensors==0.4.5 typer==0.21.1 transformers==4.54.1 tokenizers==0.21.4 huggingface-hub==0.34.3
      - name: Compile Python sources
        run: python -m compileall -q pipeline tests
      - name: Run CPU test suite
        run: pytest -q
