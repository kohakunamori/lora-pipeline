id: character
concept:
  type: character

tagger:
  stable_backend: wd_eva02_large_v3
  dual_enabled: false
  challenger_backend: null
  conflict_delta: 0.35

identity_check:
  enabled: true
  method: ccip
  min_samples: 2

caption:
  trigger_position: first
  describe_outfit: true
  describe_pose: true
  describe_expression: true
  describe_background: true
  caption_identity_features:
    mode: conservative
  blacklist:
    - artist_name
    - signature
    - watermark
  ordering:
    - trigger
    - subject
    - character
    - outfit
    - pose
    - expression
    - composition
    - background
    - objects
    - lighting

# Non-destructive dataset/target mismatch diagnostics. These thresholds only emit
# warnings; they never auto-exclude samples. Because they live under concept limits,
# changes participate in the existing preflight/train fingerprints.
limits:
  target_dataset:
    minimum_images: 12
    concentration_warning_fraction: 0.8
    character_min_semantic_outfits: 2
    outfit_min_full_body_fraction: 0.15
    minimum_category_caption_coverage: 0.25

evaluation:
  identity: true
  leakage: true
  cross_content: true
  subject_prompt: 1girl
  strengths: [0.4, 0.6, 0.8, 1.0]
  screening_strengths: [0.6, 0.8, 1.0]
  screening_prompts:
    - portrait
    - full body
    - different outfit
  prompts:
    - portrait
    - upper body
    - full body
    - different outfit
    - different hairstyle
    - different expression
    - dynamic pose
    - complex background
    - indoor
    - outdoor
    - day
    - night
